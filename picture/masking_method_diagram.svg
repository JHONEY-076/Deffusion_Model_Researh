<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #cfd6e3; stroke-width: 2; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 17px; fill: #4f5f73; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #172033; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #52616f; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #52616f; }
      .box { fill: #eef3f8; stroke: #b9c5d6; stroke-width: 1.6; }
      .seed { fill: #dfead7; stroke: #8bb36d; }
      .masked { fill: #ef6f6c; stroke: #bd4643; }
      .model { fill: #e7ddf7; stroke: #9671c8; }
      .output { fill: #d8eef0; stroke: #64a7ad; }
      .noise { fill: #f8e4bf; stroke: #d19a3f; }
      .arrow { stroke: #46586e; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .keep { fill: #7fb36a; }
      .fill { fill: #e45d59; }
      .grid { stroke: #ffffff; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46586e"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="640" y="48" class="title" text-anchor="middle">Structured Masking Generation</text>
  <text x="640" y="76" class="subtitle" text-anchor="middle">Real anomaly seed is preserved where mask=1; only temporal blocks and feature groups with mask=0 are restored.</text>

  <rect x="50" y="110" width="1180" height="170" rx="8" class="panel"/>
  <text x="80" y="145" class="label">1. Adaptive structured mask</text>
  <text x="80" y="170" class="small">Mask probability is higher where normal-anomaly distribution gap is larger.</text>
  <text x="80" y="193" class="small">Temporal block ratio = 25%; feature group ratio = 40%.</text>

  <g transform="translate(420 128)">
    <text x="0" y="-8" class="small">Real anomaly seed window</text>
    <rect x="0" y="0" width="300" height="110" class="seed"/>
    <g>
      <line x1="0" y1="22" x2="300" y2="22" class="grid"/>
      <line x1="0" y1="44" x2="300" y2="44" class="grid"/>
      <line x1="0" y1="66" x2="300" y2="66" class="grid"/>
      <line x1="0" y1="88" x2="300" y2="88" class="grid"/>
      <line x1="60" y1="0" x2="60" y2="110" class="grid"/>
      <line x1="120" y1="0" x2="120" y2="110" class="grid"/>
      <line x1="180" y1="0" x2="180" y2="110" class="grid"/>
      <line x1="240" y1="0" x2="240" y2="110" class="grid"/>
    </g>
    <text x="150" y="62" class="label" text-anchor="middle">seed</text>
  </g>

  <path d="M750 180 H840" class="arrow"/>

  <g transform="translate(865 128)">
    <text x="0" y="-8" class="small">Mask applied</text>
    <rect x="0" y="0" width="300" height="110" class="seed"/>
    <rect x="180" y="0" width="84" height="110" class="masked" opacity="0.92"/>
    <rect x="0" y="0" width="300" height="44" class="masked" opacity="0.72"/>
    <g>
      <line x1="0" y1="22" x2="300" y2="22" class="grid"/>
      <line x1="0" y1="44" x2="300" y2="44" class="grid"/>
      <line x1="0" y1="66" x2="300" y2="66" class="grid"/>
      <line x1="0" y1="88" x2="300" y2="88" class="grid"/>
      <line x1="60" y1="0" x2="60" y2="110" class="grid"/>
      <line x1="120" y1="0" x2="120" y2="110" class="grid"/>
      <line x1="180" y1="0" x2="180" y2="110" class="grid"/>
      <line x1="240" y1="0" x2="240" y2="110" class="grid"/>
    </g>
    <text x="83" y="94" class="tiny" text-anchor="middle">mask=1 keep</text>
    <text x="222" y="62" class="tiny" text-anchor="middle" fill="#ffffff">mask=0 restore</text>
  </g>

  <rect x="50" y="320" width="565" height="360" rx="8" class="panel"/>
  <text x="80" y="357" class="label">2A. Masking GT-GAN</text>
  <text x="80" y="382" class="small">Generator receives masked seed, binary mask, and noise.</text>

  <rect x="85" y="420" width="150" height="70" rx="6" class="box"/>
  <text x="160" y="449" class="small" text-anchor="middle">seed * mask</text>
  <text x="160" y="471" class="tiny" text-anchor="middle">observed values</text>

  <rect x="85" y="515" width="150" height="70" rx="6" class="box"/>
  <text x="160" y="544" class="small" text-anchor="middle">mask</text>
  <text x="160" y="566" class="tiny" text-anchor="middle">1 keep / 0 fill</text>

  <rect x="85" y="610" width="150" height="45" rx="6" class="noise"/>
  <text x="160" y="638" class="small" text-anchor="middle">noise</text>

  <path d="M245 455 H305" class="arrow"/>
  <path d="M245 550 H305" class="arrow"/>
  <path d="M245 632 H305" class="arrow"/>

  <rect x="315" y="485" width="145" height="90" rx="8" class="model"/>
  <text x="387" y="519" class="label" text-anchor="middle">GRU</text>
  <text x="387" y="544" class="small" text-anchor="middle">Generator</text>

  <path d="M465 530 H525" class="arrow"/>
  <rect x="535" y="485" width="55" height="90" rx="6" class="output"/>
  <text x="562" y="524" class="tiny" text-anchor="middle">proposal</text>
  <text x="562" y="543" class="tiny" text-anchor="middle">only for</text>
  <text x="562" y="562" class="tiny" text-anchor="middle">mask=0</text>

  <text x="335" y="628" class="small">Final:</text>
  <text x="335" y="653" class="small">fake = mask * seed + (1 - mask) * proposal</text>

  <rect x="665" y="320" width="565" height="360" rx="8" class="panel"/>
  <text x="695" y="357" class="label">2B. Masking Diffusion</text>
  <text x="695" y="382" class="small">Temporal GRU denoiser is conditioned on masked seed and mask.</text>

  <rect x="700" y="420" width="150" height="70" rx="6" class="box"/>
  <text x="775" y="449" class="small" text-anchor="middle">cond</text>
  <text x="775" y="471" class="tiny" text-anchor="middle">[seed * mask, mask]</text>

  <rect x="700" y="525" width="150" height="70" rx="6" class="noise"/>
  <text x="775" y="554" class="small" text-anchor="middle">seed + noise</text>
  <text x="775" y="576" class="tiny" text-anchor="middle">start step = 20</text>

  <path d="M860 455 H915" class="arrow"/>
  <path d="M860 560 H915" class="arrow"/>

  <rect x="925" y="475" width="165" height="100" rx="8" class="model"/>
  <text x="1007" y="510" class="label" text-anchor="middle">GRU</text>
  <text x="1007" y="535" class="small" text-anchor="middle">Diffusion</text>
  <text x="1007" y="557" class="tiny" text-anchor="middle">reverse denoising</text>

  <path d="M1095 525 H1150" class="arrow"/>
  <rect x="1160" y="485" width="45" height="80" rx="6" class="output"/>
  <text x="1182" y="518" class="tiny" text-anchor="middle">denoised</text>
  <text x="1182" y="538" class="tiny" text-anchor="middle">masked</text>
  <text x="1182" y="558" class="tiny" text-anchor="middle">region</text>

  <text x="835" y="628" class="small">Final:</text>
  <text x="835" y="653" class="small">restored = mask * seed + (1 - mask) * denoised</text>

  <g transform="translate(470 700)">
    <rect x="0" y="0" width="28" height="16" class="keep"/>
    <text x="38" y="13" class="small">kept from real anomaly seed</text>
    <rect x="255" y="0" width="28" height="16" class="fill"/>
    <text x="293" y="13" class="small">generated/restored masked region</text>
  </g>
</svg>
