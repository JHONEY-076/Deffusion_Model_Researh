<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <style>
      .bg{fill:#f3f3f3}
      .panel{fill:#f8f8f8;stroke:#333;stroke-width:1.5}
      .sheet{fill:#f7f7f7;stroke:#333;stroke-width:1.1}
      .inner{fill:#f8f8f8;stroke:#333;stroke-width:1.1}
      .window{fill:#e9e9e9;stroke:#333;stroke-width:1}
      .title{font:700 17px "Times New Roman", serif;letter-spacing:4px;fill:#000}
      .head{font:700 14px "Times New Roman", serif;letter-spacing:2px;fill:#000}
      .body{font:700 12px "Times New Roman", serif;letter-spacing:1.5px;fill:#000}
      .small{font:700 10px "Times New Roman", serif;letter-spacing:1px;fill:#000}
      .tiny{font:700 9px "Times New Roman", serif;letter-spacing:.8px;fill:#000}
      .arrow{stroke:#000;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .line{stroke:#333;stroke-width:1.2}
      .thin{stroke:#333;stroke-width:1}
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#000"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="620"/>

  <!-- Left stacked raw data sheets -->
  <rect class="sheet" x="38" y="42" width="230" height="318"/>
  <rect class="sheet" x="54" y="58" width="230" height="318"/>
  <rect class="sheet" x="70" y="74" width="230" height="318"/>
  <rect class="sheet" x="86" y="90" width="230" height="318"/>

  <text class="head" x="108" y="132">1. Original manufacturing</text>
  <text class="head" x="127" y="150">time-series data</text>
  <text class="body" x="132" y="195">Welding Process Dataset</text>

  <text class="body" x="120" y="240">• Speed</text>
  <text class="body" x="120" y="267">• Length</text>
  <text class="body" x="120" y="294">• RealPower</text>
  <text class="body" x="120" y="321">• SetPower</text>
  <text class="body" x="120" y="348">• GateOnTime</text>
  <text class="body" x="120" y="375">• WorkingTime</text>

  <line class="line" x1="86" y1="478" x2="316" y2="478"/>
  <text class="body" x="108" y="508">OK / NG labels are used</text>
  <text class="body" x="108" y="532">for window labeling</text>

  <!-- Arrow 1 -->
  <path class="arrow" d="M345 310 L430 310"/>

  <!-- Middle preprocessing panel -->
  <rect class="panel" x="460" y="82" width="560" height="396"/>
  <text class="title" x="650" y="115">2. Preprocessing</text>

  <!-- Sorting -->
  <rect class="inner" x="495" y="150" width="150" height="260"/>
  <text class="small" x="512" y="183">(1) Time-order sorting</text>
  <text class="small" x="526" y="238">Sort by WorkingTime</text>
  <g>
    <rect class="window" x="516" y="278" width="19" height="24"/><text class="tiny" x="522" y="294">t1</text>
    <rect class="window" x="535" y="278" width="19" height="24"/><text class="tiny" x="541" y="294">t2</text>
    <rect class="window" x="554" y="278" width="19" height="24"/><text class="tiny" x="560" y="294">t3</text>
    <rect class="window" x="573" y="278" width="19" height="24"/><text class="tiny" x="578" y="294">...</text>
    <rect class="window" x="592" y="278" width="24" height="24"/><text class="tiny" x="596" y="294">t30</text>
    <rect class="window" x="616" y="278" width="24" height="24"/><text class="tiny" x="620" y="294">t31</text>
  </g>
  <line class="thin" x1="515" y1="350" x2="625" y2="350"/>
  <path class="thin" d="M625 350 L613 345 M625 350 L613 355"/>
  <text class="body" x="552" y="376">time</text>

  <!-- Sliding window -->
  <rect class="inner" x="675" y="150" width="170" height="260"/>
  <text class="small" x="695" y="183">(2) Sliding window</text>
  <text class="small" x="717" y="210">size = 30, stride = 1</text>

  <text class="small" x="695" y="242">Window 1 = t1~t30</text>
  <g>
    <rect class="window" x="695" y="253" width="30" height="24"/><text class="tiny" x="705" y="269">t1</text>
    <rect class="window" x="725" y="253" width="30" height="24"/><text class="tiny" x="735" y="269">t2</text>
    <rect class="window" x="755" y="253" width="30" height="24"/><text class="tiny" x="765" y="269">...</text>
    <rect class="window" x="785" y="253" width="35" height="24"/><text class="tiny" x="792" y="269">t30</text>
  </g>

  <text class="small" x="695" y="310">Window 2 = t2~t31</text>
  <g>
    <rect class="window" x="695" y="321" width="30" height="24"/><text class="tiny" x="705" y="337">t2</text>
    <rect class="window" x="725" y="321" width="30" height="24"/><text class="tiny" x="735" y="337">t3</text>
    <rect class="window" x="755" y="321" width="30" height="24"/><text class="tiny" x="765" y="337">...</text>
    <rect class="window" x="785" y="321" width="35" height="24"/><text class="tiny" x="792" y="337">t31</text>
  </g>

  <text class="small" x="695" y="378">Window 3 = t3~t32</text>
  <g>
    <rect class="window" x="695" y="389" width="30" height="24"/><text class="tiny" x="705" y="405">t3</text>
    <rect class="window" x="725" y="389" width="30" height="24"/><text class="tiny" x="735" y="405">t4</text>
    <rect class="window" x="755" y="389" width="30" height="24"/><text class="tiny" x="765" y="405">...</text>
    <rect class="window" x="785" y="389" width="35" height="24"/><text class="tiny" x="792" y="405">t32</text>
  </g>

  <!-- Labeling rule -->
  <rect class="inner" x="875" y="150" width="115" height="260"/>
  <text class="small" x="891" y="183">(3) Label rule</text>
  <text class="small" x="895" y="235">Faulty window</text>
  <text class="tiny" x="895" y="263">If at least one</text>
  <text class="tiny" x="895" y="280">sample is NG,</text>
  <text class="tiny" x="895" y="297">the window is</text>
  <text class="tiny" x="895" y="314">faulty.</text>
  <line class="line" x1="890" y1="333" x2="975" y2="333"/>
  <text class="small" x="895" y="365">Normal window</text>
  <text class="tiny" x="895" y="391">If all samples</text>
  <text class="tiny" x="895" y="408">are OK, the</text>
  <text class="tiny" x="895" y="425">window is normal.</text>

  <!-- Arrow 2 -->
  <path class="arrow" d="M1045 310 L1132 310"/>

  <!-- Right windowed dataset and split -->
  <rect class="panel" x="1160" y="82" width="290" height="396"/>
  <text class="title" x="1210" y="115">3. Windowed dataset</text>

  <rect class="inner" x="1210" y="150" width="190" height="56"/>
  <text class="body" x="1232" y="184">Normal windows</text>

  <rect class="inner" x="1210" y="225" width="190" height="56"/>
  <text class="body" x="1232" y="259">Faulty windows</text>

  <line class="line" x1="1186" y1="307" x2="1425" y2="307"/>
  <text class="head" x="1214" y="337">Dataset split</text>

  <rect class="inner" x="1190" y="358" width="235" height="36"/>
  <text class="small" x="1206" y="381">Normal train: 135,730</text>

  <rect class="inner" x="1190" y="404" width="235" height="36"/>
  <text class="small" x="1206" y="427">Anomaly seed: 247</text>

  <rect class="inner" x="1190" y="450" width="235" height="36"/>
  <text class="small" x="1206" y="473">Validation: 1,447</text>

  <rect class="inner" x="1190" y="496" width="235" height="36"/>
  <text class="small" x="1206" y="519">Final test: 3,081</text>

  <text class="tiny" x="1193" y="562">Threshold is selected on validation only;</text>
  <text class="tiny" x="1193" y="580">final test is used only for final reporting.</text>
</svg>
