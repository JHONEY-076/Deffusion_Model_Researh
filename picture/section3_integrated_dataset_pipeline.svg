<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
  <defs>
    <style>
      .bg{fill:#f7f8fb}
      .title{font:700 34px Arial, sans-serif;fill:#172033}
      .subtitle{font:400 19px Arial, sans-serif;fill:#5c667a}
      .section{fill:#fff;stroke:#cfd6e3;stroke-width:2;rx:8}
      .blue{fill:#eaf3ff;stroke:#3b82f6;stroke-width:2;rx:8}
      .green{fill:#ecfdf3;stroke:#22c55e;stroke-width:2;rx:8}
      .orange{fill:#fff4e6;stroke:#f59e0b;stroke-width:2;rx:8}
      .gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:8}
      .label{font:700 21px Arial, sans-serif;fill:#172033}
      .step{font:700 18px Arial, sans-serif;fill:#2563eb}
      .small{font:400 16px Arial, sans-serif;fill:#4b5563}
      .tiny{font:400 14px Arial, sans-serif;fill:#667085}
      .num{font:700 24px Arial, sans-serif;fill:#172033}
      .axis{stroke:#334155;stroke-width:2}
      .grid{stroke:#d9dee8;stroke-width:1}
      .line1{fill:none;stroke:#2563eb;stroke-width:3}
      .line2{fill:none;stroke:#16a34a;stroke-width:3}
      .line3{fill:none;stroke:#f97316;stroke-width:3}
      .window{fill:#fde68a;stroke:#d97706;stroke-width:2;fill-opacity:.45}
      .bar-normal{fill:#22c55e}
      .bar-anomaly{fill:#f97316}
      .arrow{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8;fill:none}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="860"/>
  <text class="title" x="70" y="70">Figure 3.1. Dataset Construction Pipeline</text>
  <text class="subtitle" x="70" y="104">Welding process data are segmented into fixed-length windows and split for leakage-free model validation</text>

  <!-- Step 1 -->
  <rect class="section" x="60" y="150" width="380" height="575"/>
  <text class="step" x="90" y="190">3.1 Welding Process Dataset</text>
  <text class="label" x="90" y="230">Raw welding records</text>
  <text class="small" x="90" y="262">Process sensor values collected</text>
  <text class="small" x="90" y="288">during welding operation</text>

  <rect class="gray" x="100" y="335" width="285" height="190"/>
  <text class="small" x="125" y="372">Input files</text>
  <text class="tiny" x="125" y="405">Training_Data.csv</text>
  <text class="tiny" x="125" y="432">WeldingTest_01_OK.csv</text>
  <text class="tiny" x="125" y="459">WeldingTest_02_OK.csv</text>
  <text class="tiny" x="125" y="486">WeldingTest_03/04_NG.csv</text>

  <rect class="green" x="100" y="570" width="125" height="80"/>
  <text class="label" x="126" y="603">OK</text>
  <text class="tiny" x="122" y="630">normal</text>
  <rect class="orange" x="260" y="570" width="125" height="80"/>
  <text class="label" x="285" y="603">NG</text>
  <text class="tiny" x="279" y="630">anomaly</text>

  <!-- Step 2 -->
  <rect class="section" x="530" y="150" width="430" height="575"/>
  <text class="step" x="560" y="190">3.2 Window-Based Preprocessing</text>
  <text class="label" x="560" y="230">Sliding window segmentation</text>

  <rect class="gray" x="575" y="275" width="335" height="250"/>
  <line class="axis" x1="625" y1="465" x2="870" y2="465"/>
  <line class="axis" x1="625" y1="320" x2="625" y2="465"/>
  <line class="grid" x1="685" y1="320" x2="685" y2="465"/>
  <line class="grid" x1="745" y1="320" x2="745" y2="465"/>
  <line class="grid" x1="805" y1="320" x2="805" y2="465"/>
  <rect class="window" x="690" y="318" width="88" height="147"/>
  <rect class="window" x="705" y="318" width="88" height="147"/>
  <path class="line1" d="M625 420 C650 390 675 410 700 385 C730 350 750 380 780 350 C810 325 835 370 870 345"/>
  <path class="line2" d="M625 385 C650 360 678 365 705 345 C730 330 752 340 780 320 C815 300 838 335 870 315"/>
  <path class="line3" d="M625 442 C652 448 675 430 705 422 C735 410 755 435 785 415 C815 400 845 425 870 410"/>
  <text class="tiny" x="690" y="305">window size = 30</text>
  <text class="tiny" x="790" y="493">stride = 1</text>

  <rect class="blue" x="590" y="565" width="305" height="95"/>
  <text class="label" x="620" y="602">Window-level sample</text>
  <text class="small" x="620" y="632">X<tspan baseline-shift="sub">i</tspan> ∈ R<tspan baseline-shift="super">30 × d</tspan>, y<tspan baseline-shift="sub">i</tspan> ∈ {normal, anomaly}</text>

  <!-- Step 3 -->
  <rect class="section" x="1050" y="150" width="390" height="575"/>
  <text class="step" x="1080" y="190">3.3 Train / Validation / Final Test Split</text>
  <text class="label" x="1080" y="230">Window datasets</text>

  <rect class="green" x="1085" y="275" width="315" height="80"/>
  <text class="label" x="1110" y="306">Normal train</text>
  <text class="small" x="1110" y="334">135,730 normal windows</text>

  <rect class="orange" x="1085" y="375" width="315" height="80"/>
  <text class="label" x="1110" y="406">Anomaly seed</text>
  <text class="small" x="1110" y="434">247 real anomaly windows</text>

  <rect class="gray" x="1085" y="475" width="315" height="80"/>
  <text class="label" x="1110" y="506">Validation</text>
  <text class="small" x="1110" y="534">1,283 normal + 164 anomaly</text>

  <rect class="gray" x="1085" y="575" width="315" height="80"/>
  <text class="label" x="1110" y="606">Final test</text>
  <text class="small" x="1110" y="634">2,785 normal + 296 anomaly</text>

  <!-- arrows -->
  <path class="arrow" d="M440 435 L520 435"/>
  <path class="arrow" d="M960 435 L1040 435"/>

  <!-- bottom leakage-free protocol -->
  <rect class="blue" x="215" y="765" width="1070" height="58"/>
  <text class="label" x="245" y="802">Evaluation protocol:</text>
  <text class="small" x="455" y="802">thresholds are selected only on validation windows, and final performance is reported only on the unseen final test split.</text>

  <path class="dash" d="M1242 555 L1242 740 L750 740 L750 760"/>
  <text class="tiny" x="1125" y="744">no final-test leakage</text>
</svg>
